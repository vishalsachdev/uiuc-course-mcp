name: Feature request
description: Suggest an improvement to Illinois course discovery.
title: "[Feature]: "
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to accomplish?
      description: Describe the task and who benefits.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example request and desired result
      description: Include subject, year and term where relevant; public examples only.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or related official source

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "uiuc-course-mcp"
version = "0.1.0"
description = "Read-only local Illinois course discovery MCP"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.20,<2", "httpx[socks]>=0.28,<1", "defusedxml>=0.7,<1"]
[project.scripts]
uiuc-course-mcp = "uiuc_course_mcp.server:main"
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.13", "build>=1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
